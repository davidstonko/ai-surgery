title: LocalMinimum.us
description: David Stonko's website and The Local Minimum, a weekly email on AI in surgery and medicine.
author: David P. Stonko, MD, MS
url: https://localminimum.us
baseurl: ""
markdown: kramdown
kramdown:
  input: GFM
permalink: /library/:year/:month/:title/
plugins:
  - jekyll-feed
  - jekyll-sitemap
feed:
  path: feed.xml
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - README.md
