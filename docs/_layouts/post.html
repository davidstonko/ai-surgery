---
layout: default
---
<article class="post">
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.author %} &middot; {{ page.author }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.dek %}<p class="dek">{{ page.dek }}</p>{% endif %}
  <div class="prose">
{{ content }}
  </div>
  <p class="back"><a href="{{ '/library/' | relative_url }}">&larr; All posts</a></p>
</article>
