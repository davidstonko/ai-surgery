<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="{{ '/' | relative_url }}">AI and Surgery <span>Interest Group</span></a>
    <nav>
      <a href="{{ '/library/' | relative_url }}"{% if page.nav == 'library' or page.layout == 'post' %} class="on"{% endif %}>Library</a>
      <a href="{{ '/resources/' | relative_url }}"{% if page.nav == 'resources' %} class="on"{% endif %}>Resources</a>
      <a href="{{ '/skills/' | relative_url }}"{% if page.nav == 'skills' %} class="on"{% endif %}>Skills</a>
      <a href="{{ '/submit.html' | relative_url }}">Suggest</a>
      <a class="join" href="{{ '/subscribe/' | relative_url }}">Subscribe</a>
    </nav>
  </div>
</header>
<main class="wrap">
{{ content }}
</main>
<footer class="wrap foot">
  <p>{{ site.title }} &middot; Organized by David P. Stonko, MD, MS</p>
  <p><a href="{{ '/subscribe/' | relative_url }}">Subscribe</a> &middot; <a href="{{ '/submit.html' | relative_url }}">Suggest an item</a> &middot; <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
</footer>
</body>
</html>
