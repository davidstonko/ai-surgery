<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="{{ '/library/' | relative_url }}">AI and Surgery <span>Interest Group</span></a>
    <nav>
      <a href="{{ '/library/' | relative_url }}"{% if page.nav == 'library' or page.layout == 'post' %} class="on"{% endif %}>Library</a>
      <a href="{{ '/resources/' | relative_url }}"{% if page.nav == 'resources' %} class="on"{% endif %}>Resources</a>
      <a href="{{ '/submit.html' | relative_url }}">Suggest</a>
      <a class="join" href="{{ '/' | relative_url }}">Join</a>
    </nav>
  </div>
</header>
<main class="wrap">
{{ content }}
</main>
<footer class="wrap foot">
  <p>{{ site.title }} &middot; Johns Hopkins Department of Surgery &middot; Organized by David P. Stonko, MD, MS</p>
  <p><a href="{{ '/' | relative_url }}">Join the list</a> &middot; <a href="{{ '/submit.html' | relative_url }}">Suggest an item</a> &middot; <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
</footer>
</body>
</html>
