<path class="capillary" d="M230,220 C260,195 305,195 345,220"/>

<!-- Efferent arteriole --> <path class="vessel" d="M350,175 C380,175 405,180 430,195"/> <!-- Peritubular capillaries / vasa recta -->
<path class="capillary" d="M430,195 C475,215 500,245 510,295
