<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"> <title id="title">Simplified nephron schematic</title> <desc id="desc">Copy the complete SVG code into a plain-text editor, save it as nephron.svg, and reopen the saved file in a web browser to view it. This is a schematic teaching figure, not a scale drawing.</desc> <rect width="1100" height="720" fill="white"/> <defs> <style> .vessel { fill: none; stroke: #c62828; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; } .capillary { fill: none; stroke: #d84343; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; } .tubule { fill: none; stroke: #1976d2; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; } .duct { fill: #fff59d; stroke: #d4a900; stroke-width: 7; stroke-linejoin: round; } .capsule { fill: #f7fbff; stroke: #263238; stroke-width: 5; } .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #000; } .leader { fill: none; stroke: #000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; } </style> </defs> <!-- Bowman’s capsule -->
<path class="capsule" d="M225,115
                        C170,150 170,245 225,280
                        C280,315 365,290 390,225
                        C415,160 360,95 295,100
                        C265,100 242,105 225,115 Z"/>

<!-- Afferent arteriole --> <path class="vessel" d="M65,175 C120,175 156,175 205,177"/> <!-- Glomerular capillary tuft -->
